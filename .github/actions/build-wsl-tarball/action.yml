inputs:
  config:
    description: 'System configuration to build'
    required: true
  filename:
    description: 'Filename to save the image as'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build tarball 🛠️
      id: build
      uses: ./.github/actions/build-nix-expression
      with:
        expression: '.#nixosConfigurations.${{ inputs.config }}.config.system.build.images.wsl'

    - name: Copy tarball 📦
      shell: bash
      env:
        IMAGE: ${{ steps.build.outputs.derivation }}/nixos.wsl
        FILENAME: ${{ inputs.filename }}
      run: cp "$IMAGE" "$FILENAME"
